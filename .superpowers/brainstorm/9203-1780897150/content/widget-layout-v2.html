<style>
  .dash {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #ededed;
    padding: 32px;
    max-width: 560px;
    margin: 0 auto;
  }
  .widget-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 11px;
    margin-bottom: 4px;
    border-bottom: 1px solid #2a2a2a;
  }
  .widget-title { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #ededed; }
  .widget-link  { font-size: 13px; color: #888; text-decoration: none; font-weight: 500; }

  .row {
    display: grid;
    grid-template-columns: 1fr auto 52px;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-top: 1px solid #1f1f1f;
  }
  .row:first-of-type { border-top: none; }

  .name    { font-size: 14px; font-weight: 600; color: #ededed; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .student { font-size: 12.5px; color: #888; margin-top: 1px; }

  .badge {
    font-size: 12px; font-weight: 600;
    color: #ededed;
    background: #1f1f1f;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 2px 7px;
    white-space: nowrap;
    text-align: center;
  }
  .badge.complete {
    color: #4ade80;
    border-color: #14532d;
    background: #052010;
  }

  .date { font-size: 12.5px; color: #888; text-align: right; font-variant-numeric: tabular-nums; }
</style>

<div class="dash">
  <div style="background:#111;border:1px solid #1f1f1f;border-radius:10px;padding:16px 20px">
    <div class="widget-head">
      <h2 class="widget-title">Текущие циклы</h2>
      <a class="widget-link">Курсы →</a>
    </div>
    <div class="row">
      <div><div class="name">Математика</div><div class="student">Азиз</div></div>
      <span class="badge">2 / 4</span>
      <span class="date">15 июн</span>
    </div>
    <div class="row">
      <div><div class="name">Английский</div><div class="student">Группа</div></div>
      <span class="badge complete">4 / 4 ✓</span>
      <span class="date">18 июн</span>
    </div>
    <div class="row">
      <div><div class="name">Физика</div><div class="student">Айгерим</div></div>
      <span class="badge">1 / 4</span>
      <span class="date">20 июн</span>
    </div>
  </div>
</div>

<p class="subtitle" style="text-align:center;margin-top:24px">Зелёный badge = цикл завершён (все уроки пройдены)</p>
